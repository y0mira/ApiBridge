name: Feature request
description: Propose a focused capability within API Bridge's scope
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      {
        label: Problem,
        description: Describe the frontend contract workflow problem rather than only a solution.,
      }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed outcome }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
