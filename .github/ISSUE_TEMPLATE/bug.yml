name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      { label: What happened?, description: Do not paste private contracts or credentials. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      {
        label: Reproduction,
        description: Include a minimal sanitized OpenAPI document and exact commands.,
      }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version, placeholder: 0.1.0 }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, placeholder: Windows 11, Node 20.17, Chrome 128 }
    validations: { required: true }
